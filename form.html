<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 - Product Review Form</title>
    <meta name="description"
      content="WDD 131 Product Review Form assignment for rating products and sharing user experience feedback">
    <meta name="author" content="Chimezie Emmanuel">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <label for="productName">Product Name</label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
                <option value="fluxCapacitor">Flux Capacitor</option>
                <option value="powerLaces">Power Laces</option>
                <option value="timeCircuits">Time Circuits</option>
                <option value="lowVoltage">Low Voltage Reactor</option>
                <option value="warpEqualizer">Warp Equalizer</option>
            </select>
            <fieldset>
                <legend>Overall Rating</legend>
                <label for="rating1"><input type="radio" id="rating1" name="rating" value="1"
                      required> &star;</label>
                <label for="rating2"><input type="radio" id="rating2" name="rating" value="2"
                      required> &star;&star;</label>
                <label for="rating3"><input type="radio" id="rating3" name="rating" value="3"
                      required> &star;&star;&star;</label>
                <label for="rating4"><input type="radio" id="rating4" name="rating" value="4"
                      required> &star;&star;&star;&star;</label>
                <label for="rating5"><input type="radio" id="rating5" name="rating" value="5"
                      required> &star;&star;&star;&star;&star;</label>
            </fieldset>
            <label for="installDate">Date of Installation</label>
            <input type="date" id="installDate" name="installDate" required>
            <fieldset>
                <legend>Which features did you find useful? (Check all that apply)</legend>
                <label for="feat1"><input type="checkbox" id="feat1" name="features"
                      value="durability"> Durability</label>
                <label for="feat2"><input type="checkbox" id="feat2" name="features" value="ease">
                    Ease of Use</label>
                <label for="feat3"><input type="checkbox" id="feat3" name="features"
                      value="performance"> Performance</label>
                <label for="feat4"><input type="checkbox" id="feat4" name="features" value="design">
                    Design</label>
            </fieldset>
            <label for="review">Written Review (Optional)</label>
            <textarea id="review" name="review"></textarea>
            <label for="userName">Your Name (Optional)</label>
            <input type="text" id="userName" name="userName">
            <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p>&copy; 2026 | Chimezie Emmanuel | Lagos, Nigeria</p>
    </footer>
</body>

</html>
