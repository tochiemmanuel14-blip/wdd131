<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="WDD 131 Product Review Form assignment">
    <meta name="author" content="chimezie Emmanuel">
    <link rel="stylesheet" href="styles/form.css">
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <label for="productName">Product Name *</label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>Overall Rating *</legend>
                <label><input type="radio" id="rating1" name="rating" value="1" required> ☆ - 1
                    Star</label>
                <label><input type="radio" id="rating2" name="rating" value="2" required> ☆☆ - 2
                    Stars</label>
                <label><input type="radio" id="rating3" name="rating" value="3" required> ☆☆☆ - 3
                    Stars</label>
                <label><input type="radio" id="rating4" name="rating" value="4" required> ☆☆☆☆ - 4
                    Stars</label>
                <label><input type="radio" id="rating5" name="rating" value="5" required> ☆☆☆☆☆ - 5
                    Stars</label>
            </fieldset>

            <label for="installDate">Date of Installation *</label>
            <input type="date" id="installDate" name="installDate" required>

            <fieldset>
                <legend>Which features did you find useful? (Check all that apply)</legend>
                <label><input type="checkbox" id="feat1" name="features" value="Durability">
                    Durability</label>
                <label><input type="checkbox" id="feat2" name="features" value="Ease of Use"> Ease
                    of Use</label>
                <label><input type="checkbox" id="feat3" name="features" value="Performance">
                    Performance</label>
                <label><input type="checkbox" id="feat4" name="features" value="Design">
                    Design</label>
            </fieldset>

            <label for="writtenReview">Written Review</label>
            <textarea id="writtenReview" name="writtenReview" rows="4"></textarea>

            <label for="userName">Your Name</label>
            <input type="text" id="userName" name="userName">

            <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p>&copy;<span id="currentyear"></span> - chimezie Emmanuel - Nigeria</p>
        <p id="lastModified"></p>
    </footer>
    <script src="scripts/form.js" defer></script>
</body>

</html>
