<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album</title>
    <meta name="description"
      content="WDD 131 Temple Album displaying responsive temple images and a hamburger menu.">
    <meta name="author" content="Chimezie Emmanuel">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Merriweather:wght@400;700&display=swap"
      rel="stylesheet">

    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">
    <script src="scripts/temples.js" defer></script>
</head>

<body>
    <header>
        <h1>Temple Album</h1>
        <button id="menu" aria-label="Menu"></button>
        <nav class="navigation">
            <a href="#" title="Home">Home</a>
            <a href="#" title="Old">Old</a>
            <a href="#" title="New">New</a>
            <a href="#" title="Large">Large</a>
            <a href="#" title="Small">Small</a>
        </nav>
    </header>

    <main>
        <h1>Temple Gallery</h1>

        <div class="container">
            <figure>
                <img src="images/temple1.jpg" alt="Salt Lake Temple" loading="lazy" width="400"
                  height="250">
                <figcaption>Salt Lake Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple2.jpg" alt="Accra Ghana Temple" loading="lazy" width="400"
                  height="250">
                <figcaption>Accra Ghana Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple3.jpg" alt="Bern Switzerland Temple" loading="lazy"
                  width="400" height="250">
                <figcaption>Bern Switzerland Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple4.jpg" alt="Kyiv Ukraine Temple" loading="lazy" width="400"
                  height="250">
                <figcaption>Kyiv Ukraine Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple5.jpg" alt="London England Temple" loading="lazy" width="400"
                  height="250">
                <figcaption>London England Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple6.jpg" alt="Tokyo Japan Temple" loading="lazy" width="400"
                  height="250">
                <figcaption>Tokyo Japan Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple7.jpg" alt="Rome Italy Temple" loading="lazy" width="400"
                  height="250">
                <figcaption>Rome Italy Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple8.jpg" alt="Samoa Temple" loading="lazy" width="400"
                  height="250">
                <figcaption>Samoa Temple</figcaption>
            </figure>

            <figure>
                <img src="images/temple9.jpg" alt="Aba Nigeria Temple" loading="lazy" width="400"
                  height="250">
                <figcaption>Aba Nigeria Temple</figcaption>
            </figure>
        </div>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> | Chimezie Emmanuel | Nigeria</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>

</html>
