<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madagascar - Country Page</title>
    <meta name="description"
      content="WDD 131 - Dynamic Web Fundamentals - Country Page for Madagascar showcasing responsive design.">
    <meta name="author" content="Emmanuel chimezie">
    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer></script>
</head>

<body>
    <header>
        <h1>Madagascar</h1>
    </header>
    <main>
        <div class="hero">
            <picture>
                <source srcset="images/place-large.webp" media="(min-width: 600px)">
                <img src="images/place-small.webp
                " alt="Landscape of Madagascar" width="600" height="400">
            </picture>
        </div>
        <section class="data">
            <h2>Data</h2>
            <div class="info-grid">
                <span class="label">Area:</span><span class="value">587,041 sq km</span>
                <span class="label">Population:</span><span class="value">29,611,714</span>
                <span class="label">Capital:</span><span class="value">Antananarivo</span>
                <span class="label">Languages:</span><span class="value">Malagasy, French</span>
                <span class="label">Currency:</span><span class="value">Malagasy Ariary</span>
                <span class="label">Time Zone:</span><span class="value">UTC+3</span>
                <span class="label">Calling Code:</span><span class="value">+261</span>
                <span class="label">Internet TLD:</span><span class="value">.mg</span>
            </div>
        </section>
        <section class="weather">
            <h2>Weather</h2>
            <img src="images/weather.svg" alt="Weather icon" class="weather-icon" width="80"
              height="80">
            <div class="info-grid">
                <span class="label">Temperature:</span><span class="value">10 °C</span>
                <span class="label">Conditions:</span><span class="value">Partly Cloudy</span>
                <span class="label">Wind:</span><span class="value">5 km/h</span>
                <span class="label">Wind Chill:</span><span class="value" id="windchill"></span>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy;<span id="currentyear"></span> | chimezie Emmanuel | Madagascar</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
